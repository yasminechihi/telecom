; ============================================================
;  extensions.conf — Tunisie Telecom VoiceBot
;
;  Flux de l'appel agent (tt-transfer/notify) :
;    1. Lire les variables depuis AstDB
;       (Python stocke via : database put TT CLIENT_NUM ...)
;    2. Décrocher + bip d'alerte
;    3. Jouer le fichier TTS du problème client (si disponible)
;    4. Bip "début enregistrement"
;    5. Enregistrer la réponse vocale de l'agent
;    6. Hangup
;
;  Enregistrement sauvegardé dans :
;    /var/spool/asterisk/monitor/agent_reply_<TICKET_ID>.wav
;  Windows Python le détecte, transcrit avec Whisper (STT),
;  et envoie la réponse à user_app → apprentissage session bot.
; ============================================================

[general]
static        = yes
writeprotect  = no
autofallthrough = yes

[default]
exten => _.,1,Hangup()

[tt-transfer]

; ── 1. Lire les variables depuis AstDB ────────────────────
exten => notify,1,NoOp(=== Transfert TT VoiceBot ===)
exten => notify,n,Set(CLIENT_NUM=${DB(TT/CLIENT_NUM)})
exten => notify,n,Set(CLIENT_NAME=${DB(TT/CLIENT_NAME)})
exten => notify,n,Set(TICKET_ID=${DB(TT/TICKET_ID)})
exten => notify,n,Set(CLIENT_PROBLEM=${DB(TT/CLIENT_PROBLEM)})
exten => notify,n,Set(TTS_FILE=${DB(TT/TTS_FILE)})
exten => notify,n,NoOp(Client: ${CLIENT_NAME} | Tel: ${CLIENT_NUM} | Ticket: ${TICKET_ID})
exten => notify,n,NoOp(Probleme: ${CLIENT_PROBLEM})
exten => notify,n,NoOp(Fichier TTS: ${TTS_FILE})

; ── 2. Décrocher + bip d'alerte ──────────────────────────
exten => notify,n,Answer()
exten => notify,n,Wait(1)
exten => notify,n,Playback(beep)
exten => notify,n,Wait(0.5)

; ── 3. Jouer le TTS du problème (généré par Python TTS) ──
; Si TTS_FILE est rempli → jouer le fichier audio du problème
; Si TTS_FILE est vide   → juste un bip (pas de SayDigits)
exten => notify,n,ExecIf($["${TTS_FILE}" != ""]?Playback(${TTS_FILE}))
exten => notify,n,ExecIf($["${TTS_FILE}" != ""]?Wait(0.5))

; ── 4. Bip "début enregistrement" ────────────────────────
exten => notify,n,Playback(beep)
exten => notify,n,Wait(0.5)

; ── 5. Enregistrer la réponse vocale de l'agent ──────────
; Format : /var/spool/asterisk/monitor/agent_reply_<TICKET_ID>.wav
; Silence 3s → arrêt auto | Max 120s | q=quiet (pas de bip fin)
exten => notify,n,Record(/var/spool/asterisk/monitor/agent_reply_${TICKET_ID}.wav,3,120,q)

; ── 6. Bip de confirmation + Hangup ──────────────────────
exten => notify,n,Playback(beep)
exten => notify,n,Wait(0.5)
exten => notify,n,Hangup()

; ── Extension de test direct (non utilisée par le bot) ───
exten => 9999,1,Answer()
exten => 9999,n,Playback(beep)
exten => 9999,n,SayDigits(21612345678)
exten => 9999,n,Hangup()

[from-internal]
exten => _1XXX,1,NoOp(Appel interne vers ${EXTEN})
exten => _1XXX,n,Dial(SIP/${EXTEN},30)
exten => _1XXX,n,Hangup()
