name: tt_user_app
description: Mon Espace TT — Application mobile Tunisie Telecom
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP — appels vers le backend Flask
  http: ^1.2.0

  # Stockage local (session / token)
  shared_preferences: ^2.2.2

  # Navigation
  go_router: ^13.2.0

  # Icônes Material
  cupertino_icons: ^1.0.6

  # Affichage de dates
  intl: ^0.19.0

  # Animations
  flutter_animate: ^4.5.0

  # Indicateur de chargement élégant
  shimmer: ^3.0.0

  # Graphiques (camembert dashboard)
  fl_chart: ^0.66.2

  # Reconnaissance vocale (mode vocal) — fallback on-device
  speech_to_text: ^7.0.0

  # Synthèse vocale (TTS) — fallback local uniquement
  flutter_tts: ^3.8.5

  # Lecture audio — pour jouer la voix edge-tts du backend (ar-TN-ReemNeural)
  audioplayers: ^6.0.0

  # Enregistrement audio — pour envoyer l'audio au backend Whisper (meilleur STT darija)
  record: ^6.2.0

  # Répertoire temporaire pour fichiers audio
  path_provider: ^2.1.4
dependency_overrides:
  record_linux: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Générateur d'icônes de lancement
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6B21A8"   # fond violet TT
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo_tt.png
    - assets/icon/icon.png

